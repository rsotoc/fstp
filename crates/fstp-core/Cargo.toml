[package]
name        = "fstp-core"
version     = "0.1.0"
edition     = "2021"
description = "Federated Sovereign Transport Protocol — protocol primitives (Blocklace, contextual identity, synchronization agent)"
authors     = [
  "Ramón Soto C. <ramon.soto@unison.mx>",
  "Liz Soto",
]
license     = "Apache-2.0"
repository  = "https://github.com/rsotoc/fstp"
homepage    = "https://github.com/rsotoc/fstp"
documentation = "https://github.com/rsotoc/fstp/tree/main/docs"
readme      = "README.md"
keywords    = ["federation", "privacy", "blocklace", "did", "credentials"]
categories  = ["cryptography", "data-structures"]
include = [
  "src/**/*",
  "schema/**/*",
  "examples/**/*",
  "benches/**/*",
  "tests/**/*",
  "README.md",
  "LICENSE",
]

[lib]
name = "fstp_core"
path = "src/lib.rs"

[dependencies]
# Criptografía
ed25519-dalek = { workspace = true }
sha2          = { workspace = true }
hkdf          = { workspace = true }
aes-gcm       = { workspace = true }
argon2        = { workspace = true }
rand          = { workspace = true }
dirs          = { workspace = true }
hex           = { workspace = true }

# Tipos y serialización
uuid       = { workspace = true }
chrono     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

# Async (solo para AuditLog interno — sin servidor HTTP)
tokio  = { workspace = true }

# Observabilidad
tracing = { workspace = true }
base64 = "0.22.1"
automerge = { workspace = true }
flate2    = { workspace = true }
sharks    = { workspace = true }
bbs = "0.4.1"

[dev-dependencies]
criterion = { workspace = true }
proptest  = { workspace = true }

[[bench]]
name = "blocklace_stress"
harness = false

[[example]]
name = "two_nodes"
path = "examples/two_nodes.rs"
